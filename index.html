<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Inter:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <!-- Hero Cover -->
  <header id="hero-stage" class="hero-stage">
    <div id="hero-copy" class="hero-copy" hidden>
      <div id="collection-eyebrow" class="hero-eyebrow" hidden></div>

      <div class="hero-title-block">
        <h1 id="collection-title" class="hero-title" hidden></h1>
        <p id="collection-subtitle" class="hero-subtitle" hidden></p>
      </div>

      <div class="hero-spacer" aria-hidden="true"></div>
    </div>

    <div id="hero-showcase" class="hero-showcase" aria-label="Featured photographs">
      <div id="hero-slides-layer" class="hero-slides-layer"></div>
      <div class="hero-controls-bar">
        <button id="btn-explore-collection" type="button" class="hero-enter-btn">
          Enter Gallery ↓
        </button>
        <div id="hero-dots" class="hero-dots" role="tablist" aria-label="Featured slide selector"></div>
      </div>
    </div>
  </header>

  <!-- Sticky Date & View Navigation -->
  <nav id="gallery-nav" class="sticky-nav" aria-label="Gallery navigation">
    <div class="sticky-nav-inner">
      <div id="date-chapters-nav" class="date-chapters-nav" role="tablist" aria-label="Jump to date"></div>

      <div class="toolbar-controls">
        <div class="segmented-group" role="group" aria-label="View filter">
          <button id="filter-highlights" type="button" class="seg-btn is-active" data-filter="highlights">
            Highlights
          </button>
          <button id="filter-shoots" type="button" class="seg-btn" data-filter="shoots">
            Shoots
          </button>
          <button id="filter-archive" type="button" class="seg-btn" data-filter="archive">
            Archive
          </button>
          <button id="filter-favorites" type="button" class="seg-btn" data-filter="favorites">
            Favorites
          </button>
        </div>

        <div class="toolbar-utility-btns">
          <button
            id="btn-share-view"
            type="button"
            class="icon-toggle-btn"
            aria-label="Share current view"
            title="Share current view"
          >
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.35" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4.8 4.3L7 2.1l2.2 2.2" />
              <path d="M7 2.3v6.6" />
              <path d="M2.5 8v3a.9.9 0 0 0 .9.9h7.2a.9.9 0 0 0 .9-.9V8" />
            </svg>
          </button>

          <button
            id="btn-density-toggle"
            type="button"
            class="icon-toggle-btn"
            aria-label="Toggle contact sheet or editorial layout"
            title="Switch to Contact Sheet grid"
          >
            <svg width="14" height="14" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.35" aria-hidden="true">
              <rect x="1.2" y="1.2" width="4.6" height="4.6" rx="0.6" />
              <rect x="8.2" y="1.2" width="4.6" height="4.6" rx="0.6" />
              <rect x="1.2" y="8.2" width="4.6" height="4.6" rx="0.6" />
              <rect x="8.2" y="8.2" width="4.6" height="4.6" rx="0.6" />
            </svg>
          </button>

          <button
            id="btn-theme-toggle"
            type="button"
            class="icon-toggle-btn"
            aria-label="Toggle light or dark appearance"
            title="Switch light / dark appearance"
          >
            ◐
          </button>
        </div>
      </div>
    </div>
  </nav>

  <!-- Right-Edge Date Scrubber -->
  <aside id="timeline-scrubber" class="timeline-scrubber" aria-label="Date timeline" hidden></aside>

  <!-- Gallery Content -->
  <main id="gallery-main" class="gallery-main">
    <div id="chapters-container"></div>

    <div id="pagination-sentinel" class="pagination-sentinel" hidden>
      <button id="btn-load-more" type="button" class="btn-ghost" hidden>
        Show More
      </button>
    </div>
  </main>

  <!-- Minimal Footer -->
  <footer class="gallery-footer">
    <span id="footer-copyright" hidden></span>
    <button id="btn-back-top" type="button" class="back-top-btn">Back to top ↑</button>
  </footer>

  <!-- Fullscreen Lightbox -->
  <div id="lightbox-modal" class="lightbox" role="dialog" aria-modal="true" aria-label="Photograph viewer">
    <div class="lightbox-topbar">
      <div class="lb-meta-left">
        <span id="lb-counter" class="lb-counter"></span>
        <span id="lb-title" class="lb-title"></span>
      </div>
      <div class="lb-actions">
        <button id="lb-btn-zoom" type="button" class="lb-btn" title="Zoom (Z)">
          <span aria-hidden="true">⊕</span><span class="lb-btn-label">Zoom</span>
        </button>
        <button id="lb-btn-fav" type="button" class="lb-btn" title="Save to Favorites (F)">
          <span aria-hidden="true">♡</span><span class="lb-btn-label">Favorite</span>
        </button>
        <button id="lb-btn-share" type="button" class="lb-btn" title="Share photograph (S)">
          <svg width="13" height="13" viewBox="0 0 14 14" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <path d="M4.8 4.3L7 2.1l2.2 2.2" />
            <path d="M7 2.3v6.6" />
            <path d="M2.5 8v3a.9.9 0 0 0 .9.9h7.2a.9.9 0 0 0 .9-.9V8" />
          </svg>
          <span class="lb-btn-label">Share</span>
        </button>
        <a id="lb-btn-download" class="lb-btn" href="#" download title="Download photograph (D)">
          <span aria-hidden="true">↓</span><span class="lb-btn-label">Download</span>
        </a>
        <button id="lb-btn-close" type="button" class="lb-btn" title="Close (Esc)" aria-label="Close">
          ✕
        </button>
      </div>
    </div>

    <div id="lightbox-stage" class="lightbox-stage">
      <button id="lb-prev" type="button" class="lb-nav-arrow lb-prev" aria-label="Previous photograph">←</button>
      <div id="lb-img-wrap" class="lb-img-wrap">
        <img id="lb-img" class="lb-img" src="" alt="" />
      </div>
      <button id="lb-next" type="button" class="lb-nav-arrow lb-next" aria-label="Next photograph">→</button>
    </div>

    <div id="lightbox-filmstrip" class="lightbox-filmstrip" aria-label="Thumbnail strip"></div>
  </div>

  <!-- Share Feedback Toast -->
  <div id="share-toast" class="share-toast" role="status" aria-live="polite" hidden></div>

  <script src="./app.js"></script>
</body>
</html>
