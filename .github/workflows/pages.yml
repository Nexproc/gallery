name: Deploy Gallery to GitHub Pages

on:
  push:
    branches: ["main"]
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stage static site bundle & generate Open Graph share previews
        run: |
          mkdir -p _site
          cp index.html 404.html styles.css app.js .nojekyll favicon.ico icon-32.png icon-192.png icon-512.png apple-touch-icon.png site.webmanifest _site/
          python3 scripts/build_share_pages.py \
            --site-dir _site \
            --site-url https://www.nicktitcombe.com/gallery \
            --manifest-url https://storage.googleapis.com/lightsync-gallery-media-8f4a2c/manifest.json

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "_site"

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
