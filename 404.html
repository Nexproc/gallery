<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Gallery</title>
  <link rel="icon" href="/gallery/favicon.ico?v=3" sizes="any" />
  <link rel="apple-touch-icon" sizes="180x180" href="/gallery/apple-touch-icon.png?v=3" />
  <!-- Open Graph & Chat Preview Metadata -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Gallery" />
  <meta property="og:title" content="Gallery" />
  <meta property="og:description" content="Photography collection" />
  <meta property="og:url" content="https://www.nicktitcombe.com/gallery/" />
  <meta property="og:image" content="https://storage.googleapis.com/lightsync-gallery-media-8f4a2c/3k_exports/NIK39891.jpg" />
  <meta property="og:image:secure_url" content="https://storage.googleapis.com/lightsync-gallery-media-8f4a2c/3k_exports/NIK39891.jpg" />
  <meta property="og:image:type" content="image/jpeg" />
  <meta property="og:image:width" content="3000" />
  <meta property="og:image:height" content="2000" />
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="Gallery" />
  <meta name="twitter:description" content="Photography collection" />
  <meta name="twitter:image" content="https://storage.googleapis.com/lightsync-gallery-media-8f4a2c/3k_exports/NIK39891.jpg" />
  <script>
    (function () {
      var l = window.location;
      var q = new URLSearchParams(l.search);
      var pm = /\/p\/([^/]+)\/?$/.exec(l.pathname);
      var sm = /\/s\/([^/]+)\/?$/.exec(l.pathname);
      var root = l.pathname
        .replace(/\/(?:p|s)\/[^/]+\/?$/, "/")
        .replace(/\/[^/]*$/, "/");
      if (pm) {
        q.set("photo", decodeURIComponent(pm[1]));
      } else if (sm) {
        q.set("view", "shoots");
        q.set("shoot", decodeURIComponent(sm[1]));
      }
      var qs = q.toString();
      l.replace(root + (qs ? "?" + qs : "") + l.hash);
    })();
  </script>
</head>

</html>
